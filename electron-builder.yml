appId: com.hucad.circuits
productName: HuCAD Circuits
copyright: Copyright (c) 2026 BIT-CT, CTU-San Francisco

directories:
  buildResources: resources
  output: release

files:
  - out/**
  - package.json

# The vendored avr-gcc + Arduino core, copied outside the asar so the compiler
# can be spawned as a normal executable. Build it first with
# `npm run fetch:toolchain`; the download cache is excluded.
extraResources:
  - from: resources/toolchain
    to: toolchain
    filter:
      - '**/*'
      - '!.cache/**'

asar: true
npmRebuild: false

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Development
  synopsis: Offline Arduino circuit simulator
  artifactName: ${productName}-${version}.${ext}
