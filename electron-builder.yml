appId: com.hucad.circuits
productName: HuCAD Circuits
copyright: Copyright (c) 2026 BIT-CT, CTU-San Francisco

directories:
  buildResources: resources
  output: release

files:
  - out/**
  - package.json

asar: true
npmRebuild: false

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Development
  synopsis: Offline Arduino circuit simulator
  artifactName: ${productName}-${version}.${ext}
