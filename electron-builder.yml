appId: com.kheil27.vircuitcad
productName: VircuitCAD
copyright: Copyright (c) 2026 Kheil27

directories:
  buildResources: resources
  output: release

files:
  - out/**
  - package.json

# The vendored avr-gcc + Arduino core, copied outside the asar so the compiler
# can be spawned as a normal executable. Build it first with
# `npm run fetch:toolchain`; the download cache is excluded.
extraResources:
  # Only the host platform's toolchain is shipped; `fetch-toolchain.mjs` does not
  # create the other directories, which electron-builder treats as a warning.
  - from: resources/toolchain/${os}
    to: toolchain/${os}
    filter:
      - '**/*'
      - '!.cache/**'
  # Read-only example projects, loaded from process.resourcesPath/samples.
  - from: resources/samples
    to: samples
    filter:
      - '**/*.vircuit'

# GitHub replaces spaces in uploaded asset names, which would break the download
# URLs embedded in latest-*.yml; every artifact name stays space-free.
artifactName: VircuitCAD-${version}-${os}-${arch}.${ext}

# Publishing target for `electron-builder --publish always` (CI) and
# `npm run release`. `releaseType: release` makes a tag build public instead of
# the provider's default draft; the workflow switches pre-release tags over.
publish:
  provider: github
  owner: hagbongtangtanan
  repo: VircuitCAD
  releaseType: release

asar: true
npmRebuild: false

fileAssociations:
  - ext: vircuit
    name: VircuitCAD Project
    description: VircuitCAD circuit project
    mimeType: application/x-vircuitcad
    role: Editor

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Development
  synopsis: Offline Arduino circuit simulator by Kheil27
  syncDesktopName: true
