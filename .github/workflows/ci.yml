name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Lint
        run: pnpm -r --if-present lint
      - name: Test
        run: pnpm -r --if-present test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E offline guard
        run: pnpm test:e2e
      - name: License check
        run: pnpm check:licenses
      - name: Audit (non-blocking)
        run: pnpm audit --prod
        continue-on-error: true

  bench:
    name: bench
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Benchmark (fails on >20% regression)
        run: pnpm bench

  toolchain:
    name: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fetch toolchain
        run: node tools/fetch-toolchain.mjs
      - name: Compile offline (network blocked)
        run: sudo env "PATH=$PNPM_HOME:$PATH" unshare -n pnpm --filter @vircuitcad/toolchain test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E with the toolchain present
        run: pnpm test:e2e

  package-windows:
    name: package-windows
    needs: verify
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fetch toolchain
        run: node tools/fetch-toolchain.mjs
      - name: Smoke compile with an odd TEMP path
        shell: bash
        run: |
          mkdir -p "/c/vc temp ünicode"
          TEMP="C:\\vc temp ünicode" TMP="C:\\vc temp ünicode" pnpm --filter @vircuitcad/toolchain test
      - name: Build desktop
        run: pnpm --filter @vircuitcad/desktop run --if-present build
      - name: Package desktop (NSIS + portable)
        run: pnpm --filter @vircuitcad/desktop run --if-present package
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vircuitcad-win
          path: apps/desktop/release/**
          if-no-files-found: warn
          retention-days: 14
