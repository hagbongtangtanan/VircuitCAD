# Primary release path: pushing a `v*` tag builds the installers on every
# platform, keeps them as workflow artifacts, and publishes them to the matching
# GitHub Release from a single final job.
#
# Publishing used to happen from each runner independently. That races when two
# platforms finish at the same time (the second publisher tries to create a
# release that the first one just created) and it makes a failed platform look
# like a missing asset with no fallback. Building first and publishing once from
# the collected artifacts removes both failure modes.
#
# A manual `workflow_dispatch` run publishes the current package.json version.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      # The builds are intentionally unsigned: no certificate is available yet.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # No engines field or .nvmrc in the repository; Vite 8 needs
          # Node 20.19+, and the project is developed on Node 22.
          node-version: 22
          cache: npm

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # The vendored avr-gcc is Linux-only, so the Windows and macOS packages
      # are built without a compiler: electron-builder only warns about the
      # missing resource directory, and the simulator still runs.
      - name: Vendor the offline toolchain
        if: runner.os == 'Linux'
        run: npm run fetch:toolchain

      - name: Verify the vendored toolchain
        if: runner.os == 'Linux'
        run: npm run toolchain:verify

      - name: Build the app
        run: npm run build

      - name: Package the installers
        run: npx electron-builder --publish never

      # Even a platform whose publish fails in the final job leaves a complete,
      # downloadable installer behind in the run.
      - name: Keep the installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: ignore

  publish:
    name: publish release
    needs: build
    # Publish whatever built, even when one platform failed: a partial release
    # plus the workflow artifacts is better than losing the working installers.
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish every asset to one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "publishing ${tag}"
          ls -lh dist
          flags=(--title "HuCAD ${tag#v}" --generate-notes --target "${GITHUB_SHA}")
          case "${tag}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release view "${tag}" >/dev/null 2>&1 ||
            gh release create "${tag}" "${flags[@]}"
          # --clobber makes manual re-runs idempotent.
          gh release upload "${tag}" dist/* --clobber
