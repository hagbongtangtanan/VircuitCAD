# Primary release path: pushing a `v*` tag builds the Windows installer, keeps
# it as a workflow artifact, and publishes it to the matching GitHub Release.
#
# VircuitCAD ships on Windows only, so this workflow deliberately does not build
# Linux or macOS packages. Build first and publish once: the upload no longer
# runs from the same job that compiled the installer, and a failed publish still
# leaves a downloadable .exe behind in the run.
#
# A manual `workflow_dispatch` run publishes the current package.json version.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    env:
      # The installer is intentionally unsigned: no certificate is available yet.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # No engines field or .nvmrc in the repository; Vite 8 needs
          # Node 20.19+, and the project is developed on Node 22.
          node-version: 22
          cache: npm

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          if [[ ! "$version" =~ -beta\.[0-9]+$ ]]; then
            echo "::error::VircuitCAD is beta-only until further notice; package.json must use a -beta.N version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Vendors avr-gcc 7.3.0 for Windows and precompiles the Uno core, so the
      # installer works offline on a machine with no Arduino IDE.
      - name: Vendor the offline toolchain
        run: npm run fetch:toolchain

      - name: Verify the vendored toolchain
        run: npm run toolchain:verify

      - name: Build the app
        run: npm run build

      - name: Package the installer
        run: npx electron-builder --win --publish never

      - name: Keep the installer as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: ignore

  publish:
    name: publish release
    needs: build
    # Publish even after a failed build so a re-run can replace the assets.
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish every asset to one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "publishing ${tag}"
          ls -lh dist
          flags=(--title "VircuitCAD ${tag#v}" --generate-notes --target "${GITHUB_SHA}")
          case "${tag}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release view "${tag}" >/dev/null 2>&1 ||
            gh release create "${tag}" "${flags[@]}"
          # --clobber makes manual re-runs idempotent.
          gh release upload "${tag}" dist/* --clobber
