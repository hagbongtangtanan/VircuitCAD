name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fetch toolchain
        run: node tools/fetch-toolchain.mjs
      - name: Stamp version from tag
        run: node -e "const fs=require('fs');const v=process.env.GITHUB_REF_NAME.replace(/^v/,'');for(const p of ['package.json','apps/desktop/package.json']){const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=v;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');}console.log('version',v);"
      - name: Build desktop
        run: pnpm --filter @vircuitcad/desktop run --if-present build
      - name: Package desktop (NSIS + portable + zip)
        run: pnpm --filter @vircuitcad/desktop run --if-present package
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: vircuitcad-release
          path: apps/desktop/release/**
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: vircuitcad-release
          path: dist
      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name '*.exe' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "VircuitCAD ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/**/*.exe dist/**/*.zip dist/SHA256SUMS.txt
